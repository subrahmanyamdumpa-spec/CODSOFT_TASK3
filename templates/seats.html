<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select seats — Cloud Bus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">
          <span class="mark">Cloud<span>Bus</span></span>
          <span class="tagline">reserve · ride · relax</span>
        </a>
        <nav class="nav-links">
          <a href="/">Search</a>
          <a href="/bookings" class="requires-auth-link" style="display:none;">My Bookings</a>
          <a href="/login" id="loginLink">Log in</a>
          <span id="userChip" style="display:none;"></span>
          <button id="logoutBtn" class="link-btn" style="display:none;">Log out</button>
        </nav>
      </div>
    </header>

    <main class="content">
      <div class="wrap">
        <h2 class="section-title">Choose your seats</h2>
        <div class="ticket" style="margin-bottom:28px;">
          <div class="ticket-body" id="tripInfo" style="width:100%;">
            <p class="helper-text">Loading trip…</p>
          </div>
        </div>

        <div class="bus-shell" id="busShell">
          <div class="bus-front">Front of bus · Driver</div>
          <div class="seat-grid" id="seatGrid"></div>
          <div class="seat-legend">
            <span><span class="dot available"></span>Available</span>
            <span><span class="dot selected"></span>Selected</span>
            <span><span class="dot taken"></span>Booked</span>
          </div>

          <div id="passengerForm" class="passenger-form"></div>

          <div id="summaryBar" class="summary-bar" style="display:none;">
            <span id="seatCount" class="helper-text"></span>
            <span id="totalPrice" style="font-weight:700;"></span>
          </div>

          <div style="max-width:420px; margin:18px auto 0;">
            <button id="confirmBtn" class="btn btn-primary btn-block">Confirm booking</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap"><strong>CloudBus</strong> — a cloud-hosted bus reservation demo, powered by Supabase.</div>
    </footer>
  </div>

  <div id="toast"></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/seats.js"></script>
</body>
</html>
